schema_version: M050-EXTRACTION-GATE-2-SOURCE-DISPOSITION-0.1
title: MEDIAN v0.5.0 Gate 2 Source Disposition
game_target: MEDIAN v0.5.0
created: 2026-08-02
status: GATE_2_PASSED
execution_authority: false
purpose: >-
  Define the intended role and processing disposition of every current document
  in the M050 source set from its contents, not from its filename. This manifest
  becomes executable only after Gate 3 reuse audit, Gate 4 archival, and Gate 5
  implementation verification.

principles:
  - A filename, title, internal status label, and document self-description are not identity or authority.
  - Every source requires a content-and-provenance identity card before extraction.
  - Extraction order carries no authority.
  - Source-bounded extraction receives no atoms or prose from other sources.
  - Source scope and authority are applied during mapping and reconciliation.
  - The two v0.4.7 bridge ledgers, the v0.4.7 Cross-System Carryforward, and the v0.4.6 GDD Coverage-Gap Development receive a reconciliation disposition for every substantive atom.
  - The v0.4.6 GDD alone is the baseline being revised.
  - Original wording and source hashes remain immutable evidence.
  - Governance, ontology, authorial, manifestation, and publication rules remain
    separate streams; they are never flattened into game-semantic atoms.
  - Historical and provenance documents are completeness evidence, not default canon.
  - MEDIAN v0.5.1 is excluded from every v0.5.0 stage.

pre_extraction_identity_gate:
  required_for_every_source: true
  identity_card_fields:
    - actual_section_level_contents
    - origin_and_predecessor_material
    - predecessor_coverage_warning_map
    - reason_the_document_exists
    - internal_authority_claims
    - human_adjudicated_role
    - section_level_owner_or_candidate_owner
    - mixed_status_and_provisional_regions
    - extraction_streams_and_exclusions
  rule: >-
    A source cannot enter a paid work order while any identity-card field is
    inferred from its filename alone. Internal claims such as CANONICAL,
    development-lock, adopted baseline, or global-owner assertions are preserved as source
    evidence but confer no authority.

streams:
  evidence_game_semantic: Substantive statements about MEDIAN's identity, systems, mechanics, state, content contracts, and presentation behavior.
  evidence_ontology_grammar: Rules defining MSID syntax, ontology, identifiers, aliases, and semantic classes.
  evidence_authorial_rule: Rules governing canonical MEDIAN language, typography, orthography, voice, and authorial lint.
  evidence_human_ruling: Direct human decisions preserved as authority evidence before partition or application.
  reconciliation_rule: Authority, correction, conformance, and source-scope rules used only during reconciliation.
  manifestation_rule: Medium-specific translations and invariants, kept separate from the core game-semantic stream.
  publication_rule: Sourcebook, appendix, indexing, and production-architecture rules.
  provenance_evidence: Historical, survivorship, lineage, gap, and disposition evidence.

