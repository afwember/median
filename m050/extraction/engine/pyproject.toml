[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "median-gate5"
version = "0.1.0"
description = "Offline-first guarded processing foundation for MEDIAN v0.5.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema==4.23.0",
  "PyYAML==6.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]
provider-openai = ["openai==2.43.0"]
provider-anthropic = ["anthropic==0.40.0"]

[project.scripts]
median-gate5 = "median_gate5.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
median_gate5 = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
