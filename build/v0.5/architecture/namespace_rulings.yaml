# MEDIAN v0.5 — Namespace rulings ledger
#
# Append-only. Every change to `owner_namespaces.yaml` has an entry here saying
# who ruled, on what evidence, and what moved. The namespace tree is the
# primary lever for Phase 7 conflict clustering, and `owner` has no validation
# that would catch a plausible-but-wrong value — so the tree's provenance has
# to be as auditable as the records'.
#
# Status values:
#   ruled   Asa has decided; the tree reflects it
#   open    a gap or ambiguity found, awaiting a ruling
#   noted   an observation recorded so it is not rediscovered
#
# WORKFLOW (Asa, 1 August 2026). Namespace decisions are checked per source,
# not per corpus:
#
#   extract <SOURCE>  ->  review <SOURCE>  ->  rulings appended here
#                                          ->  owner_namespaces.yaml amended
#
# Reviewing after each spec means a bad namespace is caught after one document
# instead of after twenty-one. See `median-compile review --source <ID>`.

version: "0.5"

rulings:

  # ======================= ARCHITECTURE ==================================

  - id: R001
    date: 2026-08-01
    by: Asa
    status: ruled
    subject: A rule belongs to a system; Registers are accumulations of systems
    effect: >-
      Containers derived mechanically (any namespace with children). Owning a
      record to one is a validation error.

  - id: R002
    date: 2026-08-01
    by: Claude
    status: ruled
    subject: A branch may define itself
    evidence: >-
      8 of 56 bare away.crossing records define the register as a whole and
      belong to no leaf; 48 are a genuine missing system.
    effect: Flag `branch_charter` added; the container error exempts it.

  - id: R003
    date: 2026-08-01
    by: Asa
    status: ruled
    subject: A Register is a UI type
    detail: >-
      Mode is how the game is played; a Register is the camera and interaction
      grammar the player looks through; systems cluster under registers; rules
      belong to systems. Gives the camera test — which camera is live when
      this rule operates.
    effect: >-
      Tree rebuilt. Cameras recorded in the `registers:` block so extraction
      reads the criterion rather than inferring it.

  - id: R004
    date: 2026-08-01
    by: Asa
    status: ruled
    subject: The Citizen is a subject, not an owner
    detail: ~80% of rules concern Citizens.
    effect: subject/system seam documented; `citizen.*` holds only unit-defining claims.

  - id: R005
    date: 2026-08-01
    by: Asa
    status: ruled
    subject: The world's two axes
    detail: >-
      Cross-section is a transverse slice of one Median Reach — Sound Wall,
      Margin, Highway, Median, Highway, Margin, Sound Wall. The corridor is a
      longitudinal chain of Median Reach units.
    effect: Split into world.reach and world.corridor.

  - id: R006
    date: 2026-08-01
    by: Asa
    status: ruled
    subject: away.corridor should not exist
    detail: The world is only ever explored by the Player in Away Mode.
    effect: Removed; material folded into world.corridor.

  - id: R007
    date: 2026-08-01
    by: Asa
    status: ruled
    subject: Crossing systems
    detail: phases, species_experience, adversity. Staging is a phase, not a system beside them.
    effect: Three systems added under away.crossing.

  - id: R008
    date: 2026-08-01
    by: Asa
    status: ruled
    subject: The Turn lives with MEET
    detail: >-
      An Encounter is comprised of Turns. Encounter, MEET and Encounter MEET
      are one thing. Rounds are deprecated terminology and may still appear.
    effect: >-
      meet.turn added. Makes "Crossing itself does not acquire turn structure"
      legible as a refusal of another register's unit.

  - id: R009
    date: 2026-08-01
    by: Asa
    status: ruled
    subject: Species Spatial lives in DWELL
    effect: >-
      species.spatial -> home.dwell.species_spatial. Species differentiation
      expresses once per register; top-level `species` keeps only the doctrine.

  - id: R010
    date: 2026-08-01
    by: Claude
    status: ruled
    subject: Presentation is not a domain
    evidence: >-
      All 25 records that landed on ui.* in the two pilots were register rules.
      ui.turn's name attracted ten Dawn-ledger records because "turn" was
      ambiguous; none was about a Turn.
    effect: ui, ui.turn and ui.numerals removed.

  - id: R011
    date: 2026-08-01
    by: Claude
    status: ruled
    subject: Encounter origin is a parameter, not a system
    evidence: >-
      28 records on meet.home_origin are eligibility masks, Weakness selection
      and spend grammar — MEET machinery parameterised by entry point.
    effect: >-
      meet.home_origin and meet.field_origin removed; replaced by meet.turn,
      meet.eligibility, meet.choice, meet.structure.

  # ======================= OPEN — WHOLE TERRITORIES ======================
  #
  # Found by mapping all 21 compile-disposition sources against the tree and
  # asking which spec has nowhere to put its records. Four do.

  - id: R012
    status: open
    subject: Progression and Discovery has no namespace
    evidence: >-
      SPEC_PROG is "Discovery, Time, Movement and Civic Progression
      Specification". Discovery has no owner anywhere in the tree. Civic
      progression is only partly covered by population.tiers. Campaign-scale
      time is split between world.time and home.seasonal with no node for the
      arc itself.
    question: >-
      Is this one domain or several? Discovery of the corridor, civic
      advancement over a campaign, and the passage of campaign time may be one
      system or three. It persists across cameras, so it is a domain, not a
      register system.

  - id: R013
    date: 2026-08-01
    by: Asa
    status: ruled
    subject: Philosophy and pillars have no namespace — and would land badly
    evidence: >-
      PHIL_ARCH (given top authority) and PHIL_SPEC have no owner but `meta`,
      which is voice `process` by default. That would silently mark MEDIAN's
      philosophical core as internal-only material that never reaches the
      reader — the opposite of its authority.
    question: >-
      A domain for the game's thesis, pillars, tone and themes — material that
      is voice `world` and belongs in the book. `meta` is about making the
      document; this is about what the game is.
    severity: >-
      Highest of the four. A wrong owner here misfiles the most authoritative
      source in the corpus, and misfiles it as unpublishable.
    effect: >-
      `philosophy` added as a fourth Kingdom. Asa: philosophy is not world, it
      is its own Kingdom; PHIL_ARCH composes the opening chapters with many
      STATE verbatim inclusions.

  - id: R014
    status: open
    subject: Manifestations have no namespace
    evidence: MANI_SPEC and MANI_BOARD (board game manifestation).
    question: >-
      Other-medium expressions of MEDIAN. Asa ruled these become Appendixes
      rather than audit material, so this may be book architecture rather than
      a game domain.

  - id: R015
    status: open
    subject: Market position has no namespace
    evidence: RSCH_MKT, "Market Position and Comparative Landscape".
    question: Appendix material, per Asa. Same question as R014.

  # ======================= OPEN — PLACEMENT ==============================

  - id: R016
    date: 2026-08-01
    by: Asa
    status: ruled
    subject: Seasons belong to World; Weather Pressures to DWELL
    effect: >-
      home.seasonal removed; world.seasons and home.dwell.weather added. Cuts
      a three-way seam: the season is the world's, the pressure on the colony
      is DWELL's, the Encounter a pressure becomes is MEET's.
    note: >-
      SPEC_PROG 5.1 is titled "No separate seasonal or weather economy", which
      sits against this. Recorded, not resolved — Phase 8's.

  - id: R017
    date: 2026-08-01
    by: Asa
    status: ruled
    subject: Launch, Homecoming and Stopover are MEET Encounters
    detail: >-
      Home.Encounter.Launch is selected from inside DWELL, forms the party,
      and on close shifts Home -> Away resolving into Field.
      Home.Encounter.Homecoming opens when a party in Away.Field reaches the
      Colony, does colony-wide accounting, and resolves back into DWELL.
      Away.Encounter.Stopover is the same shape at an Outpost, resolving back
      into Field, and concerns expedition accounting only.
    effect: >-
      away.launch, away.homecoming and away.field.stopover removed; meet.launch,
      meet.homecoming and meet.stopover added. register.switch states the
      doctrine; these three perform it.

  - id: R018
    status: open
    subject: world as a domain
    question: >-
      Biome was ruled a Field system, but the Reach cross-section is read
      through both the TRAVEL camera and the Crossing overlay. Does the ground
      stay a domain that registers observe, or decompose per register the way
      species did?

  # ======================= NOTED =========================================

  - id: R019
    date: 2026-08-01
    by: Claude
    status: noted
    subject: Every ruling invalidates the whole extraction cache
    detail: >-
      The namespace vocabulary is hashed into the extraction cache key, because
      it demonstrably changes the answer. So any amendment here re-prices every
      source already extracted. Per-source review therefore implies two corpus
      passes, not twenty-one: a discovery pass that finds the territory, and an
      authoritative pass against the frozen vocabulary.

  - id: R020
    date: 2026-08-01
    by: Asa
    status: ruled
    subject: Thesis and Pillars are two classes
    detail: >-
      Attachment-forward is the top-line principle and belongs to Thesis.
      Pillars are the named principles that support it — "Named Citizens"
      supports Attachment-forward. Many rules across all the docs cite Pillars
      as justification.
    effect: >-
      philosophy collapsed from nine sibling systems to thesis, pillars and
      binding. Seven of the nine were individual Pillars listed as though each
      were its own system. PHIL_ARCH's eight Pillars are enumerated in the
      `philosophy.pillars` description so extraction can recognise a citation.

  - id: R021
    date: 2026-08-01
    by: Claude
    status: ruled
    subject: Citing a Pillar is not stating one
    evidence: >-
      If every rule justified by a Pillar owned to philosophy.pillars, that
      node would swallow the corpus and cluster nothing — the same failure the
      Citizen subject/system ruling guarded against.
    effect: >-
      Flag `cites_pillar` added, with a validation error for using it on
      philosophy.pillars itself. A Pillar that changes invalidates every rule
      resting on it, and the flag is how those are found.

  - id: R022
    status: open
    subject: philosophy.binding
    question: >-
      PHIL_ARCH states binding doctrines for Citizenship, Home, Away, Memory,
      Objects, Care and Presentation. Do those belong to philosophy, or to the
      domains they bind with philosophy as their source rather than their owner?

  # ======================= REGISTRY RECONCILIATION =======================
  #
  # 1 August 2026. Asa supplied MEDIAN_v0.5.0_Provisional_Namespace_and_
  # Terminology_Registry_v0.1.docx, commissioned from the ChatGPT thread where
  # the spec documents were authored. 266 terminology records with per-term
  # owner attribution and status. It declares itself a COMPILATION AID with no
  # independent canon authority — owning specifications and explicit human
  # rulings lead it. It is therefore not a canon source, but it is a second
  # independent reading of the same corpus, which makes it a validation
  # instrument: where it agrees with our tree, that is corroboration; where it
  # disagrees, one of us is wrong.
  #
  # Parsed to architecture/terminology_registry.json, 266/266 records.
  #
  # CORROBORATED, no action:
  #   Turn is MEET's unit          "One resolved choice within a MEET" (ACT.TURN)
  #   Launch is a Home MEET        "The Home MEET and commitment" (AWAY.LAUNCH)
  #   Homecoming is a MEET View    (AWAY.HOMECOMING, AWAY.HOMECOMING_MEET)
  #   EMBODY is Home-only          (REG.EMBODY)
  #   Encounter Register is dead   listed as a Deprecated Register name
  #
  # That last one is worth noting: "Colony Register", "Field Register",
  # "Crossing Register" and "Encounter Register" are all deprecated names. Our
  # namespace uses none of them.

  - id: R023
    status: open
    priority: highest
    subject: Encounter and MEET may not be identical
    conflict: >-
      R008 records Asa's ruling that "Encounter, MEET and Encounter MEET are
      three names for one thing", and that is written into prompt 3.2 and the
      meet description. The registry says the opposite: ACT.ENCOUNTER is "a
      bounded authored situation resolved through MEET", status Settled, with
      the explicit note "Do not use Encounter as the name of the Register; the
      Register is MEET." Its collision table adds: "Encounter is an authored
      content unit. MEET is the Register/operator."
    reconciliation: >-
      These may both be true of different things. Asa was describing how the
      spec documents USE the words — interchangeably — which is a fact about
      the corpus and useful to extraction. The registry is prescribing how the
      finished book SHOULD use them. If so, extraction should be told the
      sources conflate them while the lexicon keeps them distinct.
    why_it_matters: >-
      The registry's own acceptance test reads "No false synonym collapses
      Mode, Register, View, world place, content unit or manifestation
      mechanic." Prompt 3.2 currently instructs a model to do exactly that.

  - id: R024
    status: open
    priority: high
    subject: Is a Register a camera, or a mode of attention?
    conflict: >-
      R003 built the tree on "a Register is a UI type" and the camera test.
      The registry's ARCH.REGISTER reads "A distinct form of play with
      characteristic action, decision, pace and indicative camera or
      presentation", and its status note says in terms: "A Register is a mode
      of attention, not merely a camera."
    reconciliation: >-
      The camera may be the reliable INDICATOR of a register without being its
      DEFINITION, in which case the camera test survives intact as a
      discriminator and only the framing needs softening. Attention and camera
      co-vary by design. But this is the load-bearing claim of the whole tree
      and should be settled deliberately rather than assumed.

  - id: R025
    status: open
    priority: high
    subject: View is an architecture class the tree does not have
    detail: >-
      ARCH.VIEW — "A particular presentation inside a Register that does not
      alter the player's fundamental relation to subject, time and control."
      Settled, with the note "Launch, Homecoming, Stopover and Staging are
      Views or connectors, not Registers."
    question: >-
      Mode / Register / View is a three-level presentation hierarchy; the tree
      has two. For OWNERSHIP a View's rules can sit with its Register, which is
      what meet.launch and away.crossing.phases already do. But an acceptance
      test explicitly forbids collapsing the Register/View distinction, and if
      Views must be recoverable, the tree needs to mark them.

  - id: R026
    status: open
    priority: medium
    subject: items.focus is probably wrong
    conflict: >-
      Our `items.focus` reads "Choosing what to carry — Focus and expedition
      equipment selection." The registry's AWAY.FOCUS is a "[MEET presentation
      mechanic] — the situational selection of the Citizen whose camera,
      principal action and speech carry the scene", paired with AWAY.FRAMING.
      SPEC_ITEMS section 6.3 is titled "Framing and Focus", which supports the
      registry reading. ACT.APPROACH adds "The Approach exists before Tool,
      Supply or Focus expression."
    effect_if_ruled: >-
      items.focus moves to meet.focus, and meet gains `approach` and probably
      `framing`. Equipment selection at launch is already meet.launch.

  - id: R027
    status: open
    priority: medium
    subject: Exposure is a Citizen state, not a Crossing system
    conflict: >-
      We added `away.crossing.exposure` from SPEC_AWAY 7.4 "Exposure doctrine".
      The registry classes AWAY.EXPOSURE as a "[Citizen state] — accumulated
      personal pressure and possibility created through Away danger", grouped
      with Fear Memory, Distinction, Maiming, After-name and Tharn, all of
      which are lasting Citizen changes.
    effect_if_ruled: >-
      Exposure survives a camera change, so by our own test it is a domain, not
      a register system — `citizen.change` or a sibling. What stays in Crossing
      is the doctrine of how a crossing GENERATES exposure.

  - id: R028
    status: open
    priority: medium
    subject: Weather may be a World condition rather than a DWELL system
    conflict: >-
      R016 placed Weather Pressures in DWELL. The registry classes ENV.WEATHER
      and ENV.SEASON identically, both "[World condition]", siblings.
    reconciliation: >-
      Possibly a scope distinction: Weather as a world condition belongs to
      world, while the PRESSURE it puts on the colony is DWELL's. That is the
      same shape as the season/pressure/Encounter seam already recorded, and
      Asa's phrasing was "Weather Pressures", not "Weather".

  - id: R029
    date: 2026-08-01
    by: Claude
    status: noted
    subject: The registry is the Phase 6 lexicon seed
    detail: >-
      266 terms with canonical form, class, definition, owning source and
      status, plus 27 deprecated entries and a collision table with 16
      normalization rules. Phase 6 was going to derive a lexicon from the
      records; it should start from this instead and use the records to check
      it. The deprecated entries are independently valuable — they name the
      v0.4.6 language that must not be revived, which is a check no amount of
      reading the v0.5 specs would produce.
