# MEDIAN v0.5 — Owner namespace vocabulary
#
# DRAFT v0.6 — 1 August 2026 — provisional FULL tree
#
# v0.6 extends v0.5 from the two compiled pilots to all 21 sources, by reading
# every source's heading structure out of `sources/normalized_full/`. No model
# was used and no tokens were spent: Phase 1 already normalized the corpus, and
# a spec's own section headings name its territory better than a guess would.
#
# Everything added this way is PROVISIONAL and marked. It says "SPEC_PROG has
# eleven sections and four of them have nowhere to go", which is a fact about
# coverage. It does not say the names are right — those are Asa's.
#
# The `owner` field on every atomic record names the system that owns the
# claim. It is the primary lever for Phase 7 conflict clustering: two records
# with the same owner are candidates for comparison. An owner that can hold
# almost anything is worthless, because everything under it looks comparable.
#
# ==========================================================================
# THE ARCHITECTURE (Asa, 1 August 2026)
# ==========================================================================
#
#   Mode      how the game is being played — Home (build and maintain) or
#             Away (explore). Two of them.
#   Register  a UI type. The camera and interaction grammar the player is
#             looking through. Five of them, each a Noun:VERB pair.
#   System    a cluster of rules under a register, or under a domain.
#   Rule      belongs to a system. Never to a register, mode, or domain
#             directly — except a charter (see below).
#
# THE CAMERA TEST. This is the criterion the whole tree rests on, and it is
# the first one we have had that a model can apply from a passage alone:
#
#     Which camera is live when this rule operates?
#
# If the rule stops making sense when you switch registers, it is a register
# system. If it holds no matter what you are looking through, it is a domain.
#
# The test is not "which register does this feel like". It is mechanical.
# "The Jostle procedure remains entirely under the hood" only means anything
# while the highway overlay is up, so it is a Crossing rule — not a UI rule.
#
# ==========================================================================
# FOUR KINGDOMS
# ==========================================================================
#
#   PHILOSOPHY owns THE THESIS. What MEDIAN is and what every system must
#                              serve. Asa's ruling, 1 August 2026: philosophy
#                              is not world — it is its own Kingdom. PHIL_ARCH
#                              composes the opening chapters, with many STATE
#                              verbatim inclusions, so this material is voice
#                              `world` and publishable. Filing it under `meta`
#                              would have marked the corpus's most authoritative
#                              source as never reaching the reader.
#   REGISTERS own PLAY.       What the player does through a given camera.
#   DOMAINS   own PERSISTENCE. Units, stocks and ledgers that outlive any
#                              camera — the Citizen, Sustenance, the Chronicle.
#   DOCTRINE  owns THE BOOK.   Statements about the architecture and about the
#                              document, not about the world.
#
# SHAPE
#   Register system:  <mode>.<register>.<system>   home.dwell.roles
#   Universal:        meet.<system>                meet.choice
#   Domain:           <domain>.<thing>             items.tools
#
# Three levels is not a limit imposed on the tree; it is what the tree is.
# A register system is exactly mode + register + system. A domain is exactly
# domain + thing. Nothing needs a fourth.
#
# RULES
#   - Lowercase ASCII, dot-separated, underscores within a segment.
#   - A record must name an existing namespace. Extraction may not invent one;
#     it flags `owner_unclear` and a human assigns it.
#   - A namespace with children accumulates systems and is not one. Owning to
#     it is an error unless the claim defines it as a whole (`branch_charter`).
#   - Namespaces are permanent once frozen, like source IDs.
#
# WHAT IS AND IS NOT FROZEN. The ARCHITECTURE above is settled and should not
# move: two Modes, five Registers defined as UI types, the camera test, the
# four kingdoms. The SYSTEM INVENTORY is provisional. v0.6 covers all 21
# sources at the level of their section headings, which is enough for a record
# to have somewhere to go, but only 2 of ~18 specs have actually been read.
# Names will change as specs are compiled and reviewed. That is safe precisely
# because a missing or wrong system surfaces as an `owner_unclear` flag on a
# record rather than as a silent wrong assignment — extraction can run against
# a provisional inventory without corrupting it.

version: "0.6"
status: draft
frozen: false

architecture:
  home: [dwell, embody]
  away: [field, crossing]
  universal: [meet]

# THE FIVE REGISTERS are Noun:VERB pairs, and each one IS a UI type. The two
# names denote the same thing: Crossing IS RISK, Field IS TRAVEL. A register's
# node therefore already carries its verb, and a child named for the verb is
# the register nested inside itself. v0.3 had two of them — `away.crossing.risk`
# and `away.field.travel`. Extraction at high effort refused the first outright,
# 0 uses in 115 records, while effort-off used it 7 times; eight of twenty-eight
# owner disagreements between the runs came from that node alone.
#
# A register child must name a distinguishable PART of the register, never a
# synonym for it.

registers:
  home.dwell:
    noun: Colony
    verb: DWELL
    camera: Isometric, 9-dof. Age of Empires.
    play: Building and maintaining the base.
  home.embody:
    noun: Embody
    verb: EMBODY
    camera: First person inside a Citizen animal, or close first person beside one.
    play: Inhabiting a single animal.
  away.field:
    noun: Field
    verb: TRAVEL
    camera: Top-down or 2.5d. Zelda or Mario overworld.
    play: Moving the party through the landscape of a Median Reach.
  away.crossing:
    noun: Crossing
    verb: RISK
    camera: View of the highway with informational overlay.
    play: The carriageway and the act of crossing it.
  meet:
    noun: Encounter
    verb: MEET
    camera: Presentational front over a rendered backplate. Street Fighter.
    play: Universal situational resolver, entered from either Mode.

# ==========================================================================
# DISAMBIGUATION — the seams extraction is most likely to get wrong
# ==========================================================================
#
# use vs. make (Asa, 1 August 2026)
#   `items.*`         is about USING the item unit
#   `economy.recipes` is about BUILDING the item unit
#
#   "A Crafter prepares Supplies from Flexible Scrap"      -> economy.recipes
#   "A Supply is consumed when its effect is applied"      -> items.supplies
#   "Tool recipes require a Workbench"                     -> economy.recipes
#   "A standing Tool is assigned to a Role, not a Citizen" -> items.tools
#   "Winter Cultivation yields Perishable Sustenance"      -> economy.sustenance
#   "Provisioning is a Home Role with a Dawn order"        -> home.dwell.provisioning
#
# subject vs. system (Asa, 1 August 2026)
#   The Citizen is the base person unit and roughly 80% of rules concern
#   Citizens. That makes `citizen` an attractor: almost any rule can be
#   restated as a rule about Citizens, and a namespace that can own almost
#   anything is useless for clustering. A rule is owned by the system that
#   GOVERNS it, not by the subject it acts upon.
#
#   "A Citizen is a named colony member with one equal Home share" -> citizen
#   "A Citizen carries weight up the cooperative ladder"           -> economy.carrying
#   "A Citizen occupies one Role at a time"                        -> home.dwell.roles
#   "A Citizen's fear memory persists after a Crossing"            -> citizen.change
#   "Bodily adversity attaches to individual Citizens"             -> away.crossing.adversity
#
#   The test: strike the word Citizen and see what the rule is about. If a
#   system remains, the system owns it.
#
# presentation is not a domain (1 August 2026)
#   v0.4 had a top-level `ui` with `turn` and `numerals`. Because each register
#   IS a UI type, a rule about presentation belongs to the register whose
#   camera it describes. All 25 records that landed on `ui.*` in the two pilots
#   were register rules wearing a UI costume:
#
#   "The Jostle procedure stays under the hood during Crossing"    -> away.crossing.*
#   "Planning must not display exact hidden probabilities"         -> away.crossing.phases
#   "The Dawn ledger shows Structures SOUND, 2 Capacity, 2 Load"   -> home.dwell.dawn
#   "The interface should settle at Dawn and explain what changed" -> home.dwell.dawn
#
#   `ui.turn` is the sharpest case. Its name attracted ten Dawn-ledger records
#   because "turn" was ambiguous; not one of them was about a Turn. The Turn is
#   MEET's unit — see below — and had not appeared in either pilot.
#
#   Cross-register legibility doctrine, if a later spec states any, is doctrine
#   and belongs in `register.*`, not in a domain of its own.
#
# the Encounter and the Turn (Asa, 1 August 2026, corrected the same day)
#   AN ENCOUNTER IS NOT THE MEET REGISTER. Encounter is an authored content
#   unit — a bounded situation. MEET is the Register that resolves it. An
#   Encounter is comprised of Turns, and a Turn is one resolved choice within
#   a MEET.
#
#   Asa's first ruling was that Encounter, MEET and Encounter MEET were three
#   names for one thing; he corrected it against the terminology registry the
#   same day as "conflating out of hasty simplicity". "Encounter Register" is
#   listed there as a DEPRECATED register name, alongside Colony Register,
#   Field Register and Crossing Register.
#
#   This resolves the Noun:VERB scheme rather than straining it. In every
#   pair, the NOUN names the world situation or subject and the VERB names the
#   register that resolves it:
#
#     Colony:DWELL      you dwell in the Colony
#     Field:TRAVEL      you travel the Field
#     Crossing:RISK     you risk the Crossing
#     Encounter:MEET    you meet through an Encounter
#     Embody:EMBODY     the one pair where noun and verb coincide
#
#   Which is exactly why "Crossing Register" and "Encounter Register" are
#   deprecated: each names a register by its noun. The register is the verb.
#
#   Rounds are deprecated terminology for Turns and may still appear in older
#   specs; record them and let Phase 8 rule.
#
# View (Asa, 1 August 2026)
#   The registry treats View as an architecture class — "a particular
#   presentation inside a Register". Asa's ruling: it is most likely either a
#   deprecated way of naming the camera-angle quality of a Register, or an
#   information pane such as a Citizen View. Game-utility language, not one of
#   the main modes of interaction.
#
#   So the tree does NOT gain a View level. A passage about a View is owned by
#   the Register whose presentation it describes — which is what R010 already
#   established when `ui` dissolved. "Citizen View at Home" (SPEC_ITEMS 2.1)
#   is a DWELL information pane, not a register.
#
#   The Turn therefore lives with MEET, not with any Home cycle. This is what
#   makes the Crossing guard legible: "Crossing itself does not acquire turn
#   structure" is a refusal of MEET's unit, which is only a meaningful thing to
#   refuse because Turns belong to MEET.
#
#   ORIGIN IS A PARAMETER, NOT A SYSTEM. v0.4 had `meet.home_origin` and
#   `meet.field_origin`. 28 records landed on the first, and reading them they
#   are eligibility masks, Role weighting, Big and Small Weakness selection and
#   spend grammar — MEET's machinery, parameterised by where it was entered
#   from. Splitting by origin clusters Home encounters against Field encounters
#   when what Phase 7 needs is eligibility rules against eligibility rules.
#
# stating a Pillar vs. citing one (Asa, 1 August 2026)
#   "Many many rules across all the docs use the Pillars as justification."
#   That makes Pillars an attractor of exactly the kind the Citizen ruling
#   guarded against: if every rule justified by a Pillar owned to
#   `philosophy.pillars`, that node would swallow the corpus and cluster
#   nothing.
#
#   A record owns to `philosophy.pillars` only when it STATES a Pillar. A
#   record that leans on one is owned by its own system and flagged
#   `cites_pillar`.
#
#   "Named Citizens, low population, durable identity"        -> philosophy.pillars
#   "Population is capped low so that Citizens stay named"    -> population.scale
#                                                                + cites_pillar
#   "Conservation of Systems"                                 -> philosophy.pillars
#   "No separate weather economy; weather uses Conditions"    -> home.dwell.weather
#                                                                + cites_pillar
#
#   The flag is not bookkeeping. A Pillar that changes invalidates every rule
#   resting on it, and without the flag there is no way to find them.
#
# the three bridging Encounters (Asa, 1 August 2026)
#   Launch, Homecoming and Stopover are MEET Encounters, not mode-level
#   systems. They are the mechanism by which the game changes Mode.
#
#   `meet.launch`      DWELL -> Away Mode, resolving into Field
#   `meet.homecoming`  Away.Field -> Home Mode, resolving into DWELL
#   `meet.stopover`    inside Away at an Outpost, resolving back into Field
#
#   Homecoming and Stopover differ only in scope: Homecoming does colony-wide
#   accounting, Stopover does expedition accounting only. That is the seam.
#   `register.switch` states the doctrine of mode-switching; these three are
#   the Encounters that perform it.
#
# the ground and the advance (Asa, 1 August 2026)
#   The world is only ever explored by the Player in Away Mode, so there is no
#   vantage from which the ground and the advance along it come apart. v0.4 had
#   both `world.corridor` and `away.corridor`; the second is removed and its
#   material folded into the first.
#
#   The general lesson, which cost two nodes to learn: a shared segment name
#   between branches is a symptom. Ask whether the two things can ever be
#   observed apart. If they cannot, one node — not two with a seam between.
#
# species expresses once per register (Asa, 1 August 2026)
#   Species differentiation is not a single system. It surfaces in whichever
#   camera is live, and the camera test cuts it cleanly:
#
#   JOIN / GATHER / CONNECT, settlement topology, Manor House / Court / Web
#     -> home.dwell.species_spatial   (manipulated through the isometric camera)
#   Mouse chains 3-body units, Rabbit waits one macro traffic window
#     -> away.crossing.species_experience  (read through the highway overlay)
#
#   Top-level `species` keeps only the doctrine that differentiation must be
#   visible at all, and the dialect through which Deep Laws are phrased.

namespaces:

  # ======================= PHILOSOPHY — the thesis =======================
  # Asa, 1 August 2026: philosophy is a Kingdom, not part of World. PHIL_ARCH
  # is what the opening chapters are composed of, with many STATE verbatim
  # inclusions. Systems below take their names from PHIL_ARCH's and PHIL_SPEC's
  # own section headings. PROVISIONAL.

  # Two classes, per Asa, 1 August 2026: Thesis and Pillars. v0.6 had nine
  # sibling systems here, which was one level too fine — seven of them were
  # individual Pillars listed as though each were its own system.
  philosophy:
    _: >-
      What MEDIAN is, and what every major system must continue to serve.
      Voice `world` — this is book material, not process commentary.

    thesis: >-
      The top-line principles. Attachment-forward is THE top-line principle;
      Pillars exist to support it. Also the framing statements around it — a
      civilization where nobody else would call home, the four anchors of
      attachment and the attachment chain, the successful resting state,
      emotional design following logical satisfaction, and the two scales of
      crunch.

    pillars: >-
      The Design Pillars — the named principles that rules across every source
      cite as justification. PHIL_ARCH enumerates eight, under "What every
      major system must continue to serve":
        1 Attachment-forward base-building
        2 Named Citizens, low population, durable identity
        3 Ledger and legible
        4 Home grows the Colony; Away grows the Citizen
        5 Consequence without disposability
        6 Conservation of Systems
        7 One world, two Modes, five Registers
        8 Game Logic creates Attachment Space
      This namespace owns the STATEMENT of a Pillar. A rule elsewhere that
      leans on one is owned by its own system and flagged `cites_pillar` — see
      the flag, and the note on why the distinction matters.

    binding: >-
      Binding doctrines within particular domains — what PHIL_ARCH constrains
      about Citizenship, Home, Away, Memory, Objects, Care and Presentation.
      PROVISIONAL: these may belong to the domains they bind, with philosophy
      as their source rather than their owner.

  # ======================= REGISTERS — play ==============================

  home:
    _: Home Mode generally — the colony at home, across both its registers.

    dwell:
      _: >-
        Colony:DWELL — the isometric camera. Colony stewardship and domestic
        operation: building and maintaining the base.
      place_practice: >-
        The Place/Practice relation as one system. A Place is the built or
        claimed environment in which a Practice becomes materially possible;
        Places support Practices and alter contextual Load rather than
        operating as stand-alone production facilities.
      roles: Role architecture, assignment, Capacity, equal civic shares.
      projects: Projects, Citizen-Days, Construction Queue, concurrency.
      conditions: Global Conditions, diffuse wear, structural abstraction.
      dawn: >-
        Dawn adjudication, the daily economy and turn order, and the Dawn
        ledger through which the day's changes are read.
      deficiency: The hidden Deficiency ledger and shortfall pressure.
      equilibrium: Quiet Equilibrium and successful stillness.
      provisioning: Provisioning Roles, preservation, supply preparation.
      species_spatial: >-
        Species identity expressed through settlement topology — the placement
        verbs JOIN, GATHER and CONNECT, and the Manor House, Court and Web
        images they form.
      weather: >-
        Weather Pressures at Home (Asa, 1 August 2026) — Heavy Winds, Flash
        flood, Winter shortage and Predator pressure as pressure on the colony.
        The season they occur in is `world.seasons`; the Encounter a pressure
        becomes is `meet.*`; the pressure itself is DWELL's.
      attention: >-
        DWELL attention states — Open and Called, and the attention threshold
        at which native information gives way to MEET. PROVISIONAL, from
        PASS_047 §4 and §9.
      beautification: >-
        Beautification and non-Project civic acts. PROVISIONAL, from
        PASS_OVER §2.6-2.7.

    embody:
      _: >-
        Embody:EMBODY — first person inside a Citizen animal, or close first
        person beside one. Inhabiting a single Citizen.
      access: Global Home availability, access conditions, the state ladder.
      presence: Practice and Presence architecture, the dramaturgical cycle.
      memory_access: How EMBODY retrieves or leaves prior events.
      families: >-
        EMBODY Mode Families and the guided-experience constraint — guided
        experience, not free roam. PROVISIONAL, from SPEC_EMBOD §6 and §9.
      species_embodiment: >-
        Species spatial identity as inhabited — Mouse protected continuity,
        Rabbit shared social ground, Squirrel maintained reachability.
        PROVISIONAL, from SPEC_EMBOD §7.

  away:
    _: Away Mode generally — expedition across both its registers.

    field:
      _: >-
        Field:TRAVEL — top-down or 2.5d camera. Moving the party through the
        landscape of a Median Reach. The register IS travel; route texture,
        pace and multi-day journeys belong here, not in a child node.
      nodes: Nodes, Reaches, what a place in the field is.
      biome: Biome as encountered in travel — what a biome does to a journey.
      salvage: Salvage, foraging, what the field yields.
      party: >-
        Party representation and core Field state — how the expedition is shown
        and tracked while travelling. PROVISIONAL, from SPEC_AWAY §8.1-8.2.
      pace: >-
        Species movement and party pace — Rabbit pro-rated speed, Core Species
        determining party pace, mixed-party interpretation. PROVISIONAL, from
        SPEC_PROG §8 and SPEC_SPECIES §4.
      turn_back: >-
        Turn-back authority and route texture — the player's power to abandon a
        route mid-journey. PROVISIONAL, from SPEC_AWAY §8.3-8.5.

    crossing:
      _: >-
        Crossing:RISK — view of the highway with informational overlay. The
        register IS risk; the crossing action, commitment and exposure belong
        here, not in a child node.
      phases: >-
        The phase structure of a crossing — Planning, Commitment, Continuous
        Run, Resolution — what each phase is, what it admits, and what it
        closes. Staging is a property of a phase, not a system beside them, so
        the foreground runner and what remains visible behind it are owned
        here, as is what the planning overlay may and may not show.
      species_experience: >-
        Core Species body grammar during a crossing — how a Mouse, Rabbit or
        Squirrel body crosses, and what each species' planning question is.
      adversity: >-
        Adversity scope — global party outcome against bodily adversity
        attaching to individual Citizens, and how the two resolve.
      traffic: Traffic readability during a crossing, timing, lanes.
      return_logic: Crossing-specific return and abort rules.
      exposure: >-
        Exposure doctrine and the consequence ladder — what a crossing costs
        and how badly. PROVISIONAL, from SPEC_AWAY §7.3-7.4.

  meet:
    _: >-
      Encounter:MEET — presentational front over a rendered backplate. The
      universal situational resolver, reachable from either Mode. MEET is the
      Register; an Encounter is the authored content unit it resolves. Do not
      write "the Encounter Register" — that name is deprecated.
    turn: >-
      The Turn as MEET's unit of resolution — one resolved choice within a
      MEET, and an Encounter is comprised of Turns. Rounds are deprecated
      terminology for the same idea.
    eligibility: >-
      Which Roles, Citizens and stakes an Encounter may draw on. Eligibility
      masks per Encounter family, Big and Small Weakness selection, and how
      Role strength elsewhere in the colony shapes what is offered.
    choice: Choice Events and persistent situations.
    structure: >-
      Encounter grammar shared across origins — the three-choice silhouette,
      option architecture, and the spend/refusal transaction.
    event_time: >-
      Event time — Telegraph, Impact, Persistence, Aftermath. PROVISIONAL,
      from PASS_047 §10.
    composition: >-
      Participant scale and relational scene composition — how many are in the
      scene and how they stand to one another. PROVISIONAL, from PASS_047 §6.
    backdrop: >-
      Spatial fidelity and Encounter backdrops — the rendered backplate the
      presentational front sits over. PROVISIONAL, from PASS_047 §12.
    defense: >-
      Base defense and Home-origin MEET. PROVISIONAL, from PASS_047 §11; may
      belong with `eligibility`.

    # THE THREE BRIDGING ENCOUNTERS (Asa, 1 August 2026). Launch, Homecoming
    # and Stopover are not mode-level systems and not Field systems — they are
    # Encounters, and they are what physically moves the game between Modes and
    # Registers. `register.switch` states the doctrine; these three perform it.
    launch: >-
      Home.Encounter.Launch — a specific instance of MEET (Asa), selected by
      the player from inside DWELL. Forms
      the Expedition party, and on close shifts the game from Home Mode to Away
      Mode, resolving into the Field Register. Owns the launch interface,
      party formation, legible Home subtraction, preparation guardrails, and
      execution or cancellation.
    homecoming: >-
      Home.Encounter.Homecoming — opens when a party in Away.Field reaches the
      Colony, and on close shifts the game back to Home Mode, resolving into
      DWELL. Owns colony-wide Away accounting: Cargo into colony-wide store,
      Keepsake distribution for the deceased, wounded Citizens into healing.
    stopover: >-
      Away.Encounter.Stopover — the same shape as Homecoming but occurring
      inside Away Mode at an Outpost, and resolving back into Field rather
      than into DWELL. Concerns EXPEDITION accounting only — Cargo, Tool
      repair, Rest, Care, Watch, Store — never colony-wide matters. The
      Outpost as a place on the corridor is `world.outposts`.

  # ======================= DOMAINS — persistence =========================
  # A rule belongs here if it holds whatever camera is live.

  citizen:
    _: >-
      The Citizen unit itself — what a Citizen is, and what is true of every
      Citizen regardless of what they are doing. Not a home for rules that
      merely act on Citizens; those belong to the system that governs them.
    record: Citizen Record schema and what is tracked.
    change: Lasting change — fear memory, Distinctions, After-names.
    harm: Harm, wounds, Maiming, tharn.
    bonds: Bonds, Hearths, relationships.
    naming: Given Names, After-names, naming grammar.

  population:
    _: Population doctrine, counts, presence states.
    growth: The three growth paths; birth and arrival generally.
    wanderers: >-
      Wanderers as early adult growth — arrival routes, the Wanderer MEET and
      acceptance, what arrives with one. PROVISIONAL, from SPEC_POP §7.
    hearth: >-
      Hearths as lineage unit, the Nursery as a Place, and the Nesting Season
      sequence. PROVISIONAL, from SPEC_POP §8.
    maturity: >-
      Young Citizens, dependence and maturity. PROVISIONAL, from SPEC_POP §9.
    scale: Scale, species density, target population bands, overcrowding.

  guest:
    _: Guest Citizens generally.
    recruitment: How Guests arrive and are recruited.
    contract: Guest species contracts, roster, permissions, the two Guest types.
    hospitality: Hospitality, visible difference, found family.
    signature: >-
      The Signature function — equivalent but not equal, and why Signature and
      ordinary Capacity do not stack into aptitude. PROVISIONAL, from
      SPEC_GUEST §6.

  species:
    _: >-
      The doctrine of species differentiation — that the same population and
      functions must produce visibly different colonies and expeditions. How
      that difference expresses is owned by the register it expresses in.
    traits: >-
      The Core Species mechanical traits as units — Mouse Distributed Body,
      Squirrel Strained Carry and the Jostle procedure, Rabbit Pro-Rated Field
      Speed — and comparative species power. PROVISIONAL, from SPEC_SPECIES.
    dialect: Deep Laws expressed through species phrasing.
    premise: >-
      Ecological premise beneath each species — bodily premise and the cultural
      translation into the Surface Manor, Thicket Court and Web. PROVISIONAL,
      from SPEC_ECOL §5-8.

  economy:
    _: Resources, stocks, and material logistics — the supply side.
    sustenance: Perishable and Durable Sustenance; cultivation; winter growing.
    scrap: Flexible and Rigid Scrap as materials.
    carrying: Weight ladder, cooperative carrying, party-scale carry.
    recipes: >-
      Making item units. Recipe classes, recipe grammar, inputs, costs, who
      may produce what, and where production happens.
    stock: >-
      Cargo and Colony Stock — where material sits and how it moves between
      party and colony. PROVISIONAL, from PASS_OVER §4.3.

  items:
    _: Personal items and equipment in use.
    tools: Using a Tool — classes, assignment, Render permissions, latent martial utility.
    supplies: Using a Supply — general utility, contextual effects, synergy, consumption.
    keepsakes: Holding a Keepsake — provenance, inheritance, Exposure.
    artifacts: Holding an Artifact — Colony and Carried, Place of Pride.
    focus: Choosing what to carry — Focus and expedition equipment selection.
    render: >-
      RENDER — the permission by which an item is put to use. PROVISIONAL,
      from PASS_OVER §4 and SPEC_ITEMS §3.4.
    strain: >-
      Tool Strain, Damage and Carry — how equipment degrades in use.
      PROVISIONAL, from SPEC_ITEMS §3.3.

  # OPEN (1 August 2026): the ground is observed through both the TRAVEL camera
  # and the Crossing overlay, which is the case for a domain. But Biome was
  # ruled a Field system, so the ground may decompose per register the way
  # species did. Held as a domain pending a ruling.
  world:
    _: The ground the game happens on, across both axes of the corridor.
    reach: >-
      The Median Reach in transverse section — one slice across the road:
      Sound Wall, Margin, Highway, Median, Highway, Margin, Sound Wall. The
      anatomy of one Reach and what each band of it is.
    corridor: >-
      The corridor in longitudinal section — the chain of Median Reach units
      laid end to end. Sequence, continuity, and the service crossovers that
      join one Reach to the next.
    outposts: >-
      Outposts, Held Reaches, the Away hierarchy and the Rest-Stop Metropolis
      as places on the chain. PROVISIONAL, from PASS_OVER §3.3-3.7.
    seasons: >-
      Seasons and the year (Asa, 1 August 2026). The season is a property of
      the world, not of Home. Note SPEC_PROG §5.1 states there is no separate
      seasonal economy — record it and let Phase 8 rule.
    day_band: >-
      The four playable Day Bands, time of day, traffic cycles and Road Work.
      PROVISIONAL, from SPEC_PROG §5-6.
    cadence: >-
      The shared calendar — Home day cadence and Away time cadence, and how
      the two stay in step. PROVISIONAL, from SPEC_PROG §6-7.
    ecology: >-
      Shared ecology of highway medians — the island-sanctuary paradox,
      infrastructure as naturalized terrain, noise as climate and signal,
      resource gradients, water, drainage, predators.

  culture:
    _: Folklore, Laws, Sayings, and world-facing culture.
    laws: Laws as functional tutorialization; Deep Laws.
    sayings: Sayings as non-instructional folklore.
    literacy: Literacy scope constraint and written culture.

  memory:
    _: Campaign Memory generally.
    chronicle: >-
      The Colony's selective civic history, the Homecoming write sequence and
      the canonical narrative minimum.
    tale: Citizen Tales, prior-life tales, interstitial material.
    keepsake_memory: Memorial continuity and remembered material.
    distinctions: >-
      Distinctions and After-names as earned record. PROVISIONAL, from
      PASS_OVER §1.4; may belong with `citizen.change`.

  # PROVISIONAL — R012. SPEC_PROG is "Discovery, Time, Movement and Civic
  # Progression" and four of its eleven sections had nowhere to go. Discovery
  # had no owner anywhere in the tree.
  progression:
    _: >-
      How a campaign advances — what becomes known, what becomes possible, and
      what ends it. Persists across cameras, so a domain.
    discovery: >-
      Discovery, Nodes and knowledge — TRAVEL reveals the Field, Nodes become
      meaningful through MEET, lasting outcomes are direct.
    advancement: >-
      Tier advancement and advanced Practices — learning an advanced Practice
      and the progression chain.
    proofs: >-
      Tier proofs and recognition — the five proofs, readiness, the recognition
      MEET, and what recognition does not do.
    corridor_arc: >-
      Corridor progression as campaign arc — how far the colony has reached and
      what that unlocks. Seam with `world.corridor`, which is the ground.
    victory: >-
      The win condition and what ending a campaign means. PROVISIONAL, from
      PASS_OVER §3.8.

  art:
    _: Art and audio direction carrying mechanical consequence.

  # ======================= DOCTRINE — the book ===========================

  register:
    _: >-
      Cross-register architecture — the five-Register canon as a whole, and
      any legibility doctrine that holds across every camera.
    topology: Register/View doctrine; what each register is and is not.
    switch: Mode-switch doctrine and transitions between Home and Away.
    world_state: >-
      One world state across five Registers — the guarantee that the registers
      are views of one simulation. PROVISIONAL, from PASS_047 §7.
    numerals: >-
      Personal information and numerical restraint held across every camera —
      what is never shown anywhere. The register-specific case of what a given
      overlay hides belongs to that register.

  # PROVISIONAL — R014. Asa ruled Manifestations become an Appendix rather
  # than audit material, so this may be book architecture rather than a domain.
  manifestation:
    _: >-
      MEDIAN in media other than the primary one. The four canonical
      manifestations and the hierarchy between them.
    invariants: >-
      Cross-manifestation canon — foundational invariants, what may change by
      medium, register translation doctrine, the universal cycle.
    tabletop: The tabletop roleplaying manifestation.
    board: The board game manifestation.

  # PROVISIONAL — R015. Appendix material, per Asa.
  market:
    _: Market identity and comparative landscape.
    identity: Genre language, audience intersection, product position.
    distinctiveness: The v0.5.0 distinctiveness stack.
    comparison: Comparison classes, rules, and named neighbours.

  book:
    _: >-
      The architecture of the published document itself — what goes in the
      body, what goes in an appendix, and how the two are kept in step.
    appendix: >-
      Appendix doctrine, the published appendix suite, entry schema, and
      body-to-appendix routing rules. PROVISIONAL, from APDX_PLAN.
    lexicon: Canonical usage, naming and compound forms.

  meta:
    _: Process and doctrine. Voice `process` by default.
    doctrine: Document doctrine, precedence, scope, supersession statements.
    acceptance: Acceptance tests, non-goals, complexity guards.
    open: Explicitly deferred and provisional items.
