edition: '0.5'
versions:
  normalizer_full: '1.0'
  lean_ruleset: '1.0'
  chunker: '1.0'
  extraction_prompt: '2.0'
  record_schema: '2.0'
  judgment_prompt: '1.0'
  probe: '1.0'
human_gates:
  conflict_rulings: true
  terminology: true
  architecture: true
  release: true
chunking:
  target_tokens: 5500
  max_tokens: 7000
  overlap_tokens: 400
  respect_headings: true
  seam_fraction: 0.9
providers:
  extraction:
    provider: anthropic
    model: claude-sonnet-5
    max_output_tokens: 48000
    thinking_tokens: 0
    pricing:
      input_per_mtok: 3.0
      output_per_mtok: 15.0
  judgment:
    provider: openai
    model: ${OPENAI_JUDGMENT_MODEL}
    reasoning_effort: high
