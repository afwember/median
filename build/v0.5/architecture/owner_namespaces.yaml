# MEDIAN v0.5 — Owner namespace vocabulary
#
# DRAFT v0.5 — 1 August 2026 — rebuilt on Asa's register-as-UI-type model
#
# The `owner` field on every atomic record names the system that owns the
# claim. It is the primary lever for Phase 7 conflict clustering: two records
# with the same owner are candidates for comparison. An owner that can hold
# almost anything is worthless, because everything under it looks comparable.
#
# ==========================================================================
# THE ARCHITECTURE (Asa, 1 August 2026)
# ==========================================================================
#
#   Mode      how the game is being played — Home (build and maintain) or
#             Away (explore). Two of them.
#   Register  a UI type. The camera and interaction grammar the player is
#             looking through. Five of them, each a Noun:VERB pair.
#   System    a cluster of rules under a register, or under a domain.
#   Rule      belongs to a system. Never to a register, mode, or domain
#             directly — except a charter (see below).
#
# THE CAMERA TEST. This is the criterion the whole tree rests on, and it is
# the first one we have had that a model can apply from a passage alone:
#
#     Which camera is live when this rule operates?
#
# If the rule stops making sense when you switch registers, it is a register
# system. If it holds no matter what you are looking through, it is a domain.
#
# The test is not "which register does this feel like". It is mechanical.
# "The Jostle procedure remains entirely under the hood" only means anything
# while the highway overlay is up, so it is a Crossing rule — not a UI rule.
#
# ==========================================================================
# TWO KINGDOMS
# ==========================================================================
#
#   REGISTERS own PLAY.       What the player does through a given camera.
#   DOMAINS   own PERSISTENCE. Units, stocks and ledgers that outlive any
#                              camera — the Citizen, Sustenance, the Chronicle.
#   DOCTRINE  owns THE BOOK.   Statements about the architecture and about the
#                              document, not about the world.
#
# SHAPE
#   Register system:  <mode>.<register>.<system>   home.dwell.roles
#   Universal:        meet.<system>                meet.choice
#   Domain:           <domain>.<thing>             items.tools
#
# Three levels is not a limit imposed on the tree; it is what the tree is.
# A register system is exactly mode + register + system. A domain is exactly
# domain + thing. Nothing needs a fourth.
#
# RULES
#   - Lowercase ASCII, dot-separated, underscores within a segment.
#   - A record must name an existing namespace. Extraction may not invent one;
#     it flags `owner_unclear` and a human assigns it.
#   - A namespace with children accumulates systems and is not one. Owning to
#     it is an error unless the claim defines it as a whole (`branch_charter`).
#   - Namespaces are permanent once frozen, like source IDs.
#
# WHAT IS AND IS NOT FROZEN. The ARCHITECTURE above is settled and should not
# move: two Modes, five Registers defined as UI types, the camera test, the
# two kingdoms. The SYSTEM INVENTORY below is not settled and cannot be, since
# 2 of ~18 v0.5 specs have been read. Systems will be added as specs are
# compiled. That is safe precisely because a missing system surfaces as an
# `owner_unclear` flag on a record rather than as a silent wrong assignment —
# extraction can run against an incomplete inventory without corrupting it.

version: "0.5"
status: draft
frozen: false

architecture:
  home: [dwell, embody]
  away: [field, crossing]
  universal: [meet]

# THE FIVE REGISTERS are Noun:VERB pairs, and each one IS a UI type. The two
# names denote the same thing: Crossing IS RISK, Field IS TRAVEL. A register's
# node therefore already carries its verb, and a child named for the verb is
# the register nested inside itself. v0.3 had two of them — `away.crossing.risk`
# and `away.field.travel`. Extraction at high effort refused the first outright,
# 0 uses in 115 records, while effort-off used it 7 times; eight of twenty-eight
# owner disagreements between the runs came from that node alone.
#
# A register child must name a distinguishable PART of the register, never a
# synonym for it.

registers:
  home.dwell:
    noun: Colony
    verb: DWELL
    camera: Isometric, 9-dof. Age of Empires.
    play: Building and maintaining the base.
  home.embody:
    noun: Embody
    verb: EMBODY
    camera: First person inside a Citizen animal, or close first person beside one.
    play: Inhabiting a single animal.
  away.field:
    noun: Field
    verb: TRAVEL
    camera: Top-down or 2.5d. Zelda or Mario overworld.
    play: Moving the party through the landscape of a Median Reach.
  away.crossing:
    noun: Crossing
    verb: RISK
    camera: View of the highway with informational overlay.
    play: The carriageway and the act of crossing it.
  meet:
    noun: Encounter
    verb: MEET
    camera: Presentational front over a rendered backplate. Street Fighter.
    play: Universal situational resolver, entered from either Mode.

# ==========================================================================
# DISAMBIGUATION — the seams extraction is most likely to get wrong
# ==========================================================================
#
# use vs. make (Asa, 1 August 2026)
#   `items.*`         is about USING the item unit
#   `economy.recipes` is about BUILDING the item unit
#
#   "A Crafter prepares Supplies from Flexible Scrap"      -> economy.recipes
#   "A Supply is consumed when its effect is applied"      -> items.supplies
#   "Tool recipes require a Workbench"                     -> economy.recipes
#   "A standing Tool is assigned to a Role, not a Citizen" -> items.tools
#   "Winter Cultivation yields Perishable Sustenance"      -> economy.sustenance
#   "Provisioning is a Home Role with a Dawn order"        -> home.dwell.provisioning
#
# subject vs. system (Asa, 1 August 2026)
#   The Citizen is the base person unit and roughly 80% of rules concern
#   Citizens. That makes `citizen` an attractor: almost any rule can be
#   restated as a rule about Citizens, and a namespace that can own almost
#   anything is useless for clustering. A rule is owned by the system that
#   GOVERNS it, not by the subject it acts upon.
#
#   "A Citizen is a named colony member with one equal Home share" -> citizen
#   "A Citizen carries weight up the cooperative ladder"           -> economy.carrying
#   "A Citizen occupies one Role at a time"                        -> home.dwell.roles
#   "A Citizen's fear memory persists after a Crossing"            -> citizen.change
#   "Bodily adversity attaches to individual Citizens"             -> away.crossing.adversity
#
#   The test: strike the word Citizen and see what the rule is about. If a
#   system remains, the system owns it.
#
# presentation is not a domain (1 August 2026)
#   v0.4 had a top-level `ui` with `turn` and `numerals`. Because each register
#   IS a UI type, a rule about presentation belongs to the register whose
#   camera it describes. All 25 records that landed on `ui.*` in the two pilots
#   were register rules wearing a UI costume:
#
#   "The Jostle procedure stays under the hood during Crossing"    -> away.crossing.*
#   "Planning must not display exact hidden probabilities"         -> away.crossing.phases
#   "The Dawn ledger shows Structures SOUND, 2 Capacity, 2 Load"   -> home.dwell.dawn
#   "The interface should settle at Dawn and explain what changed" -> home.dwell.dawn
#
#   `ui.turn` is the sharpest case. Its name attracted ten Dawn-ledger records
#   because "turn" was ambiguous; not one of them was about a Turn. The Turn is
#   MEET's unit — see below — and had not appeared in either pilot.
#
#   Cross-register legibility doctrine, if a later spec states any, is doctrine
#   and belongs in `register.*`, not in a domain of its own.
#
# the Encounter and the Turn (Asa, 1 August 2026)
#   Encounter, MEET, and Encounter MEET are three names for one thing. An
#   Encounter is comprised of Turns. Rounds are deprecated terminology and may
#   still appear in older specs; record them and let Phase 8 rule.
#
#   The Turn therefore lives with MEET, not with any Home cycle. This is what
#   makes the Crossing guard legible: "Crossing itself does not acquire turn
#   structure" is a refusal of MEET's unit, which is only a meaningful thing to
#   refuse because Turns belong to MEET.
#
#   ORIGIN IS A PARAMETER, NOT A SYSTEM. v0.4 had `meet.home_origin` and
#   `meet.field_origin`. 28 records landed on the first, and reading them they
#   are eligibility masks, Role weighting, Big and Small Weakness selection and
#   spend grammar — MEET's machinery, parameterised by where it was entered
#   from. Splitting by origin clusters Home encounters against Field encounters
#   when what Phase 7 needs is eligibility rules against eligibility rules.
#
# the ground and the advance (Asa, 1 August 2026)
#   The world is only ever explored by the Player in Away Mode, so there is no
#   vantage from which the ground and the advance along it come apart. v0.4 had
#   both `world.corridor` and `away.corridor`; the second is removed and its
#   material folded into the first.
#
#   The general lesson, which cost two nodes to learn: a shared segment name
#   between branches is a symptom. Ask whether the two things can ever be
#   observed apart. If they cannot, one node — not two with a seam between.
#
# species expresses once per register (Asa, 1 August 2026)
#   Species differentiation is not a single system. It surfaces in whichever
#   camera is live, and the camera test cuts it cleanly:
#
#   JOIN / GATHER / CONNECT, settlement topology, Manor House / Court / Web
#     -> home.dwell.species_spatial   (manipulated through the isometric camera)
#   Mouse chains 3-body units, Rabbit waits one macro traffic window
#     -> away.crossing.species_experience  (read through the highway overlay)
#
#   Top-level `species` keeps only the doctrine that differentiation must be
#   visible at all, and the dialect through which Deep Laws are phrased.

namespaces:

  # ======================= REGISTERS — play ==============================

  home:
    _: Home Mode generally — the colony at home, across both its registers.

    # OPEN (1 August 2026): the seasonal loop is lived at Home but bears on
    # Away, so the camera test does not obviously place it. Left at Mode level
    # pending a ruling; it may be a DWELL system or a domain.
    seasonal: Seasonal loop and the year as it is lived at Home.

    dwell:
      _: >-
        Colony:DWELL — the isometric camera. Colony stewardship and domestic
        operation: building and maintaining the base.
      place_practice: >-
        The Place/Practice relation as one system. A Place is the built or
        claimed environment in which a Practice becomes materially possible;
        Places support Practices and alter contextual Load rather than
        operating as stand-alone production facilities.
      roles: Role architecture, assignment, Capacity, equal civic shares.
      projects: Projects, Citizen-Days, Construction Queue, concurrency.
      conditions: Global Conditions, diffuse wear, structural abstraction.
      dawn: >-
        Dawn adjudication, the daily economy and turn order, and the Dawn
        ledger through which the day's changes are read.
      deficiency: The hidden Deficiency ledger and shortfall pressure.
      equilibrium: Quiet Equilibrium and successful stillness.
      provisioning: Provisioning Roles, preservation, supply preparation.
      species_spatial: >-
        Species identity expressed through settlement topology — the placement
        verbs JOIN, GATHER and CONNECT, and the Manor House, Court and Web
        images they form.

    embody:
      _: >-
        Embody:EMBODY — first person inside a Citizen animal, or close first
        person beside one. Inhabiting a single Citizen.
      access: Global Home availability, access conditions, the state ladder.
      presence: Practice and Presence architecture, the dramaturgical cycle.
      memory_access: How EMBODY retrieves or leaves prior events.

  away:
    _: Away Mode generally — expedition across both its registers.

    # OPEN (1 August 2026): launch and homecoming are the seams between Modes
    # and have no camera of their own, so the camera test does not place them
    # as register systems. Left at Mode level pending a ruling; they may belong
    # with `register.switch`.
    launch: Expedition launch, party formation, the outward bracket.
    homecoming: Return logic, Homecoming, what comes back and how.

    field:
      _: >-
        Field:TRAVEL — top-down or 2.5d camera. Moving the party through the
        landscape of a Median Reach. The register IS travel; route texture,
        pace and multi-day journeys belong here, not in a child node.
      nodes: Nodes, Reaches, what a place in the field is.
      biome: Biome as encountered in travel — what a biome does to a journey.
      stopover: Stopovers, refuge, Rest, Care, Watch, Store.
      salvage: Salvage, foraging, what the field yields.

    crossing:
      _: >-
        Crossing:RISK — view of the highway with informational overlay. The
        register IS risk; the crossing action, commitment and exposure belong
        here, not in a child node.
      phases: >-
        The phase structure of a crossing — Planning, Commitment, Continuous
        Run, Resolution — what each phase is, what it admits, and what it
        closes. Staging is a property of a phase, not a system beside them, so
        the foreground runner and what remains visible behind it are owned
        here, as is what the planning overlay may and may not show.
      species_experience: >-
        Core Species body grammar during a crossing — how a Mouse, Rabbit or
        Squirrel body crosses, and what each species' planning question is.
      adversity: >-
        Adversity scope — global party outcome against bodily adversity
        attaching to individual Citizens, and how the two resolve.
      traffic: Traffic readability during a crossing, timing, lanes.
      return_logic: Crossing-specific return and abort rules.

  meet:
    _: >-
      Encounter:MEET — presentational front over a rendered backplate. The
      universal situational resolver, reachable from either Mode. Encounter,
      MEET and Encounter MEET are one thing.
    turn: >-
      The Turn as MEET's unit of resolution — an Encounter is comprised of
      Turns. Rounds are deprecated terminology for the same idea.
    eligibility: >-
      Which Roles, Citizens and stakes an Encounter may draw on. Eligibility
      masks per Encounter family, Big and Small Weakness selection, and how
      Role strength elsewhere in the colony shapes what is offered.
    choice: Choice Events; Telegraph, Impact, Persistence, Aftermath.
    structure: >-
      Encounter grammar shared across origins — the three-choice silhouette,
      option architecture, and the spend/refusal transaction.

  # ======================= DOMAINS — persistence =========================
  # A rule belongs here if it holds whatever camera is live.

  citizen:
    _: >-
      The Citizen unit itself — what a Citizen is, and what is true of every
      Citizen regardless of what they are doing. Not a home for rules that
      merely act on Citizens; those belong to the system that governs them.
    record: Citizen Record schema and what is tracked.
    change: Lasting change — fear memory, Distinctions, After-names.
    harm: Harm, wounds, Maiming, tharn.
    bonds: Bonds, Hearths, relationships.
    naming: Given Names, After-names, naming grammar.

  population:
    _: Population doctrine, counts, presence states.
    growth: Growth, birth, arrival.
    tiers: Colony Tiers and Tier proofs.
    scale: Scale, species density, target population bands.

  guest:
    _: Guest Citizens generally.
    recruitment: How Guests arrive and are recruited.
    contract: Guest species contracts, roster, permissions.
    hospitality: Hospitality, visible difference, found family.

  species:
    _: >-
      The doctrine of species differentiation — that the same population and
      functions must produce visibly different colonies and expeditions. How
      that difference expresses is owned by the register it expresses in.
    dialect: Deep Laws expressed through species phrasing.

  economy:
    _: Resources, stocks, and material logistics — the supply side.
    sustenance: Perishable and Durable Sustenance; cultivation; winter growing.
    scrap: Flexible and Rigid Scrap as materials.
    carrying: Weight ladder, cooperative carrying, party-scale carry.
    recipes: >-
      Making item units. Recipe classes, recipe grammar, inputs, costs, who
      may produce what, and where production happens.

  items:
    _: Personal items and equipment in use.
    tools: Using a Tool — classes, assignment, Render permissions, latent martial utility.
    supplies: Using a Supply — general utility, contextual effects, synergy, consumption.
    keepsakes: Holding a Keepsake — provenance, inheritance, Exposure.
    artifacts: Holding an Artifact — Colony and Carried, Place of Pride.
    focus: Choosing what to carry — Focus and expedition equipment selection.

  # OPEN (1 August 2026): the ground is observed through both the TRAVEL camera
  # and the Crossing overlay, which is the case for a domain. But Biome was
  # ruled a Field system, so the ground may decompose per register the way
  # species did. Held as a domain pending a ruling.
  world:
    _: The ground the game happens on, across both axes of the corridor.
    reach: >-
      The Median Reach in transverse section — one slice across the road:
      Sound Wall, Margin, Highway, Median, Highway, Margin, Sound Wall. The
      anatomy of one Reach and what each band of it is.
    corridor: >-
      The corridor in longitudinal section — the chain of Median Reach units
      laid end to end. Sequence, continuity, and the service crossovers that
      join one Reach to the next. Also progression along the chain: Held
      Reaches, outposts, and the Metropolis arc.
    time: Day structure, traffic cycles, Road Work.
    ecology: Ecological influences, predators, drainage, sound.

  culture:
    _: Folklore, Laws, Sayings, and world-facing culture.
    laws: Laws as functional tutorialization; Deep Laws.
    sayings: Sayings as non-instructional folklore.
    literacy: Literacy scope constraint and written culture.

  memory:
    _: Campaign Memory generally.
    chronicle: The Colony's selective civic history.
    tale: Citizen Tales, prior-life tales, interstitial material.
    keepsake_memory: Memorial continuity and remembered material.

  art:
    _: Art and audio direction carrying mechanical consequence.

  # ======================= DOCTRINE — the book ===========================

  register:
    _: >-
      Cross-register architecture — the five-Register canon as a whole, and
      any legibility doctrine that holds across every camera.
    topology: Register/View doctrine; what each register is and is not.
    switch: Mode-switch doctrine and transitions between Home and Away.

  meta:
    _: Process and doctrine. Voice `process` by default.
    doctrine: Document doctrine, precedence, scope, supersession statements.
    acceptance: Acceptance tests, non-goals, complexity guards.
    open: Explicitly deferred and provisional items.
