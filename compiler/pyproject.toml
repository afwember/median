[project]
name = "median-compile"
version = "0.1.0"
description = "Phase-gated compiler for the MEDIAN GDD"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "pydantic>=2.7", "rich>=13.7", "pyyaml>=6.0", "typing-extensions>=4.9"]

[project.scripts]
median-compile = "median_compile.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
